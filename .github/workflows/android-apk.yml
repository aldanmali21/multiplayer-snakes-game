name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: snakes-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Every build of main becomes a public download:
  # https://github.com/aldanmali21/multiplayer-snakes-game/releases/latest/download/snakes.apk
  release:
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snakes-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk snakes.apk
          gh release create "v1.0.${{ github.run_number }}" snakes.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Snakes 1.0.${{ github.run_number }}" \
            --notes "Download snakes.apk below and open it on an Android phone. If asked, allow installing apps from this source." \
            --latest
