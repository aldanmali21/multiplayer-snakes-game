name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Make the APK smaller
        # Native libraries are most of the app; store them compressed so the download is smaller.
        run: |
          echo "expo.useLegacyPackaging=true" >> android/gradle.properties
          grep -n "useLegacyPackaging" android/app/build.gradle
      - name: Build APK for modern phones (64-bit)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          mkdir -p ../dist
          mv app/build/outputs/apk/release/app-release.apk ../dist/snakes.apk
      - name: Build APK for older phones (32-bit)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a
          mv app/build/outputs/apk/release/app-release.apk ../dist/snakes-older-phones.apk
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: snakes-apk
          path: dist/*.apk
          if-no-files-found: error

  # Every build of main becomes a public download:
  # https://github.com/aldanmali21/multiplayer-snakes-game/releases/latest/download/snakes.apk
  release:
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snakes-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" snakes.apk snakes-older-phones.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Snakes 1.0.${{ github.run_number }}" \
            --notes "Download snakes.apk and open it on an Android phone (if asked, allow installing apps from your browser). Very old phones that refuse it can use snakes-older-phones.apk." \
            --latest
